version: 2

models:

  - name: stg_houses
    description: "Données immobilières nettoyées à partir de la source brute."

    columns:

      - name: surface
        description: "Surface du logement en mètres carrés."
        data_tests:
          - not_null

      - name: rooms
        description: "Nombre de pièces."
        data_tests:
          - not_null

      - name: age
        description: "Âge du logement."
        data_tests:
          - not_null

      - name: distance_city
        description: "Distance par rapport au centre-ville."
        data_tests:
          - not_null

      - name: price
        description: "Prix du logement."
        data_tests:
          - not_null


  - name: ml_houses
    description: "Dataset préparé pour les prochaines étapes Machine Learning."

    columns:

      - name: price
        data_tests:
          - not_null