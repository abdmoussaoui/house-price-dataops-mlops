version: 2

sources:

  - name: raw_data
    schema: raw_data

    description: "Données brutes chargées dans DuckDB par le pipeline dlt."

    config:
      freshness:
        warn_after:
          count: 24
          period: hour

        error_after:
          count: 48
          period: hour

      loaded_at_field: ingested_at

    tables:

      - name: houses
        description: "Données immobilières brutes."

        columns:

          - name: house_id
            description: "Identifiant technique du logement."
            data_tests:
              - not_null
              - unique

          - name: surface
            description: "Surface du logement."
            data_tests:
              - not_null

          - name: rooms
            description: "Nombre de pièces."
            data_tests:
              - not_null

          - name: age
            description: "Âge du logement."
            data_tests:
              - not_null

          - name: distance_city
            description: "Distance par rapport au centre-ville."
            data_tests:
              - not_null

          - name: price
            description: "Prix du logement."
            data_tests:
              - not_null

          - name: ingested_at
            description: "Date et heure d'ingestion par dlt."
            data_tests:
              - not_null